<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Ice Cube Run 3D</title>
<style>
  html,body{margin:0;height:100%;background:#0b1020;overflow:hidden;
            font-family:system-ui,Segoe UI,Arial,sans-serif;color:#e9f3ff;}
  canvas{display:block;}
  #hud{position:fixed;left:0;top:0;right:0;height:52px;background:rgba(8,12,28,0.85);
       display:flex;align-items:center;gap:22px;padding:0 18px;box-sizing:border-box;
       font-weight:700;font-size:14px;z-index:5;}
  #bar{width:280px;height:18px;border-radius:6px;background:#17223c;border:1.5px solid #39507e;
       position:relative;overflow:hidden;}
  #fill{position:absolute;left:0;top:0;bottom:0;width:100%;background:#4aa8ff;}
  #num{position:absolute;right:7px;top:1px;font-size:11px;}
  #hud .dim{color:#7a8cb0;font-weight:400;font-size:12px;margin-left:auto;}
  #tip{position:fixed;left:0;right:0;bottom:0;padding:8px 10px;text-align:center;
       background:rgba(6,10,22,0.85);color:#b9ccf0;font-size:13px;line-height:1.5;z-index:5;}
  #screen{position:fixed;inset:0;display:none;align-items:center;justify-content:center;
          text-align:center;background:rgba(5,9,20,0.88);z-index:10;}
  #screen h1{font-size:56px;margin:0 0 10px;color:#9fe6ff;}
  #screen p{font-size:18px;margin:8px 0;color:#c8d8f5;}
  #screen .go{color:#ffe27a;font-weight:700;font-size:22px;margin-top:26px;}
  #screen .red{color:#ff8080;}
  #screen .title{font-size:72px;letter-spacing:2px;margin:0;
    background:linear-gradient(180deg,#ffffff 0%,#9fe6ff 55%,#3f9fe0 100%);
    -webkit-background-clip:text;background-clip:text;color:transparent;
    text-shadow:0 0 30px rgba(120,200,255,0.35);}
  #screen .sub{font-size:22px;color:#fff;margin:6px 0 24px;}
  .menu{display:flex;flex-direction:column;gap:10px;align-items:center;margin-top:18px;}
  .btn{min-width:300px;padding:12px 22px;border-radius:10px;border:2px solid #39507e;background:#17223c;
       color:#e9f3ff;font-size:18px;font-weight:700;cursor:pointer;font-family:inherit;}
  .btn:hover,.btn.sel{border-color:#ffe27a;color:#ffe27a;background:#1d2b4d;}
  .btn .val{float:right;color:#9fe6ff;}
  .legend{display:inline-grid;grid-template-columns:34px auto;gap:10px 14px;text-align:left;
          font-size:17px;align-items:center;margin-top:10px;}
  .sw{width:30px;height:22px;border-radius:5px;display:inline-block;}
  .hint{color:#7a8cb0;font-size:13px;margin-top:22px;}
  #callout{position:fixed;left:50%;top:70px;transform:translateX(-50%);padding:10px 22px;border-radius:12px;
           font-size:24px;font-weight:800;pointer-events:none;z-index:6;opacity:0;transition:opacity .15s;
           background:rgba(8,12,28,0.8);border:2px solid currentColor;text-shadow:0 2px 6px #000;}
  #hud.melting #bar{box-shadow:0 0 14px #ff5a3a;border-color:#ff5a3a;}
</style>
</head>
<body>
<div id="hud">
  <span>SIZE</span>
  <div id="bar"><div id="fill"></div><span id="num">100</span></div>
  <span id="lvl">LEVEL 1 / 3</span>
  <span id="time">TIME 0:00.0</span>
  <span id="deaths">MELTS 0</span>
  <span class="dim">WASD / Arrows move &nbsp;-&nbsp; R restarts level</span>
</div>
<div id="tip"></div>
<div id="callout"></div>
<div id="screen"></div>

<!-- three.js is the only library, linked by URL as the jam rules allow -->
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script>
"use strict";
/* =========================================================================
   ICE CUBE RUN 3D  -  theme: SHRINKING
   The whole game simulates in the same 2D "pixel" space as the original
   (960x600, top-down) and only the RENDERING is 3D: 20 px = 1 world unit.
   That keeps the level geometry that was machine-verified beatable.

   SECTIONS
     1. Balance constants & helpers
     2. Level data (walls, zones, snowflakes, hazards)
     3. Collision & movement (AABB + corner correction)
     --- everything above is pure logic; verify.js re-uses it ---
     4. Input
     5. Game state
     6. Hazards: dog, seagull, hot tiles
     7. Update loop
     8. three.js scene, meshes, particles, camera
     9. HUD / screens
    10. Main loop
   ========================================================================= */

/* --------------------------------------------------------- 0. SETTINGS */
const DIFFS = [{name:"Chill", mult:0.7}, {name:"Normal", mult:1.0}, {name:"Spicy", mult:1.4}];
let settings = {diff:1, shake:true, camFar:false};
try { Object.assign(settings, JSON.parse(localStorage.getItem("icecube3d") || "{}")); } catch(e){}
function saveSettings(){ try { localStorage.setItem("icecube3d", JSON.stringify(settings)); } catch(e){} }

/* ---------------------------------------------------------- 1. BALANCE */
const W = 960, H = 600;         // logical arena in px
const PLAY_TOP = 56;
const U = 20;                   // px per world unit

const MAX_SIZE = 100, MIN_PX = 12, MAX_PX = 48;
const DRAIN_BASE = 1.5;         // size per second just for existing
const DRAIN_SUN  = 12;          // in sunlight
const DRAIN_HOT  = 20;          // on a hot tile
const FLAKE_GAIN = 12;
const LICK_COST  = 8;           // a dog lick
const GULL_COST  = 10;          // a seagull hit

const DOG_SPEED_WANDER = 90, DOG_SPEED_CHASE = 165, DOG_SIGHT = 190, DOG_HALF = 13;
const GULL_WARN = 1.2, GULL_DIVE = 0.45, GULL_HIT_R = 34;

function pxFor(size){ return MIN_PX + (size / MAX_SIZE) * (MAX_PX - MIN_PX); }
function speedFor(size){ return 300 - size * 1.6; }
function clamp(v,a,b){ return v < a ? a : v > b ? b : v; }
function aabb(ax,ay,aw,ah, bx,by,bw,bh){ return ax < bx+bw && ax+aw > bx && ay < by+bh && ay+ah > by; }
function pointIn(px,py,r){ return px >= r.x && px <= r.x + r.w && py >= r.y && py <= r.y + r.h; }
function fmtTime(s){ const m = Math.floor(s/60), r = s - m*60; return m + ":" + (r < 10 ? "0" : "") + r.toFixed(1); }

/* ---------------------------------------------------------- 2. LEVELS */
function border(){
  return [
    {x:0,    y:PLAY_TOP, w:W,  h:20},
    {x:0,    y:H-20,     w:W,  h:20},
    {x:0,    y:PLAY_TOP, w:20, h:H-PLAY_TOP},
    {x:W-20, y:PLAY_TOP, w:20, h:H-PLAY_TOP}
  ];
}
const LEVELS = [
  { // LEVEL 1 - tutorial, no hazards
    tips: ["Yellow SUN melts you fast. Dark SHADE stops the melting. Snowflakes grow you back.",
           "Reach the glowing freezer."],
    start: {x:70, y:140},
    freezer: {x:845, y:478, w:72, h:76},
    walls: border().concat([ {x:20, y:204, w:820, h:60}, {x:140, y:392, w:820, h:60} ]),
    sun:   [{x:420, y:76,  w:160, h:128}],
    shade: [{x:560, y:264, w:160, h:128}],
    hot: [], beams: [], dogs: [], gull: false,
    flakes:[{x:300, y:328}, {x:420, y:516}]
  },
  { // LEVEL 2 - the slot, a dog, hot tiles
    tips: ["Too big? Melt a little. Shrink in the sun until you fit the slot.",
           "RED tiles burn. The DOG licks - it won't follow you into shade, and small cubes outrun it."],
    start: {x:70, y:150},
    freezer: {x:845, y:250, w:72, h:76},
    walls: border().concat([
      {x:600, y:76,  w:25, h:224}, {x:600, y:326, w:25, h:254},       // slot y300..326
      {x:180, y:76,  w:24, h:340}, {x:340, y:260, w:24, h:320}, {x:470, y:76, w:24, h:300}
    ]),
    sun:   [{x:500, y:76,  w:95, h:504}],
    shade: [{x:400, y:400, w:66, h:170}, {x:630, y:280, w:70, h:70}],
    hot:   [{x:230, y:416, w:60, h:90}, {x:240, y:120, w:80, h:60}],
    beams: [],
    dogs:  [{x:880, y:150, path:[[700,150],[880,150],[880,520],[700,520]]}],
    gull: false,
    flakes:[{x:260, y:500}, {x:420, y:200}, {x:700, y:420}, {x:780, y:230}, {x:870, y:500}]
  },
  { // LEVEL 3 - finale: two slots, beams, two dogs, a seagull
    tips: ["Two slots, two sizes. Beams sweep - there is a safe lane between them.",
           "A SEAGULL marks you with a shadow, then dives. Step off it!"],
    start: {x:70, y:500},
    freezer: {x:850, y:90, w:72, h:76},
    walls: border().concat([
      {x:360, y:76,  w:24, h:104}, {x:360, y:214, w:24, h:366},       // slot y180..214 (34px)
      {x:680, y:76,  w:24, h:342}, {x:680, y:442, w:24, h:138}        // slot y418..442 (24px)
    ]),
    sun:   [{x:250, y:76,  w:100, h:504}, {x:596, y:430, w:80, h:150}],
    shade: [{x:50, y:300, w:90, h:110}, {x:610, y:240, w:64, h:70}, {x:712, y:400, w:80, h:80}],
    hot:   [{x:160, y:300, w:60, h:120}, {x:800, y:300, w:60, h:90}],
    beams: [ {x0:400, x1:590, y:76,  w:56, h:230, speed:0.9, phase:0},
             {x0:400, x1:590, y:346, w:56, h:234, speed:0.9, phase:Math.PI} ],
    dogs:  [{x:640, y:110, path:[[420,110],[650,110],[650,330],[420,330]]},
            {x:900, y:540, path:[[740,560],[900,560],[900,230],[740,230]]}],
    gull: true,
    flakes:[{x:150, y:480}, {x:120, y:180}, {x:420, y:120}, {x:470, y:540}, {x:620, y:180},
            {x:780, y:330}, {x:800, y:170}, {x:860, y:480}]
  }
];
function findSlots(lv){
  const out = [];
  for (const a of lv.walls) for (const b of lv.walls){
    if (a === b || a.x !== b.x || a.w !== b.w) continue;
    const gap = b.y - (a.y + a.h);
    if (gap > 0 && gap < 70) out.push({x:a.x, w:a.w, y:a.y + a.h, h:gap});
  }
  return out;
}
LEVELS.forEach(lv => { lv.slots = findSlots(lv); });

/* ------------------------------------------- 3. COLLISION & MOVEMENT */
function collides(cx, cy, half, walls){
  const x = cx - half, y = cy - half, s = half * 2;
  for (let i = 0; i < walls.length; i++){
    const w = walls[i];
    if (aabb(x, y, s, s, w.x, w.y, w.w, w.h)) return true;
  }
  return false;
}
const CC = 12;   // corner correction: slide sideways this far to find a slot
function moveAxis(p, dx, dy, walls){
  const nx = p.x + dx, ny = p.y + dy;
  if (!collides(nx, ny, p.half, walls)) { p.x = nx; p.y = ny; return true; }
  for (let d = 1; d <= CC; d++){
    if (dx !== 0){
      if (!collides(nx, p.y - d, p.half, walls)) { p.x = nx; p.y -= d; return true; }
      if (!collides(nx, p.y + d, p.half, walls)) { p.x = nx; p.y += d; return true; }
    } else {
      if (!collides(p.x - d, ny, p.half, walls)) { p.x -= d; p.y = ny; return true; }
      if (!collides(p.x + d, ny, p.half, walls)) { p.x += d; p.y = ny; return true; }
    }
  }
  return false;
}
function setSize(p, newSize, walls){
  newSize = clamp(newSize, 0, MAX_SIZE);
  const nh = pxFor(newSize) / 2;
  if (nh > p.half && collides(p.x, p.y, nh, walls)){
    let ok = false;
    for (let d = 1; d <= 18 && !ok; d++){
      for (const o of [[d,0],[-d,0],[0,d],[0,-d],[d,d],[-d,d],[d,-d],[-d,-d]]){
        if (!collides(p.x + o[0], p.y + o[1], nh, walls)){ p.x += o[0]; p.y += o[1]; ok = true; break; }
      }
    }
    if (!ok) return false;
  }
  p.size = newSize; p.half = nh; return true;
}
function beamRectsAt(lv, t){
  return lv.beams.map(b => {
    const k = 0.5 + 0.5 * Math.sin(t * b.speed + b.phase);
    return {x: b.x0 + (b.x1 - b.x0) * k, y: b.y, w: b.w, h: b.h};
  });
}
// how fast the cube melts standing at (x,y)
function drainAt(lv, x, y, t){
  if (lv.shade.some(r => pointIn(x, y, r))) return 0;
  if (lv.hot.some(r => pointIn(x, y, r)))   return DRAIN_HOT;
  if (lv.sun.some(r => pointIn(x, y, r)))   return DRAIN_SUN;
  if (beamRectsAt(lv, t).some(r => pointIn(x, y, r))) return DRAIN_SUN;
  return DRAIN_BASE;
}
// can the dog at A see the cube at B? (walk the segment, stop at a wall)
function lineOfSight(ax, ay, bx, by, walls){
  const d = Math.hypot(bx - ax, by - ay), n = Math.ceil(d / 8);
  for (let i = 1; i < n; i++){
    const x = ax + (bx - ax) * i / n, y = ay + (by - ay) * i / n;
    for (const w of walls) if (pointIn(x, y, w)) return false;
  }
  return true;
}
/*__VERIFY_CUT__*/

/* ------------------------------------------------------------ 4. INPUT */
const keys = Object.create(null);
let confirmPressed = false, restartPressed = false;
const BLOCK = {ArrowUp:1,ArrowDown:1,ArrowLeft:1,ArrowRight:1,Space:1};
addEventListener("keydown", e => {
  if (BLOCK[e.code]) e.preventDefault();
  if (!keys[e.code]){
    if (e.code === "Enter" || e.code === "Space") confirmPressed = true;
    if (e.code === "KeyR") restartPressed = true;
  }
  keys[e.code] = true;
});
addEventListener("keyup", e => { keys[e.code] = false; });
function axisInput(){
  let dx = 0, dy = 0;
  if (keys.KeyA || keys.ArrowLeft)  dx -= 1;
  if (keys.KeyD || keys.ArrowRight) dx += 1;
  if (keys.KeyW || keys.ArrowUp)    dy -= 1;
  if (keys.KeyS || keys.ArrowDown)  dy += 1;
  if (dx && dy){ dx *= Math.SQRT1_2; dy *= Math.SQRT1_2; }
  return {dx, dy};
}

/* ------------------------------------------------------- 5. GAME STATE */
const STATE = {TITLE:"title", PLAY:"play", DEAD:"dead", LEVELEND:"levelend", WIN:"win"};
let state = STATE.TITLE, levelIndex = 0, level = null;
let player = null, flakes = [], dogs = [], gull = null;
let levelTime = 0, bankedTime = 0, totalTime = 0, deaths = 0;
let beamT = 0, worldTime = 0, shakeT = 0;

function loadLevel(i){
  levelIndex = i; level = LEVELS[i];
  flakes = level.flakes.map(f => ({x:f.x, y:f.y, taken:false}));
  lastZone = "open"; calloutT = 0;
  player = {x:level.start.x, y:level.start.y, size:MAX_SIZE, half:pxFor(MAX_SIZE)/2,
            inSun:false, inShade:false, moving:false, dripTimer:0, hurtT:0, kbx:0, kby:0};
  dogs = level.dogs.map(d => ({x:d.x, y:d.y, half:DOG_HALF, path:d.path, wp:0,
                               state:"wander", t:0, lostT:0, lickCd:0, fx:1, fy:0}));
  gull = level.gull ? {phase:"circle", t:5, tx:0, ty:0, ang:0, x:0, y:0, h:1} : null;
  levelTime = 0; beamT = 0;
  buildScene();
  state = STATE.PLAY;
}
function startGame(){ bankedTime = 0; totalTime = 0; deaths = 0; loadLevel(0); }

/* ---------------------------------------------------------- 6. HAZARDS */
function updateDogs(dt){
  const p = player, walls = level.walls;
  for (const d of dogs){
    d.lickCd = Math.max(0, d.lickCd - dt);
    const dist = Math.hypot(p.x - d.x, p.y - d.y);
    const sees = dist < DOG_SIGHT && !p.inShade && lineOfSight(d.x, d.y, p.x, p.y, walls);

    if (d.state === "pause"){ d.t -= dt; if (d.t <= 0) d.state = "wander"; continue; }
    if (d.state === "wander" && sees){ d.state = "chase"; d.lostT = 0; }
    if (d.state === "chase" && !sees){ d.lostT += dt; if (d.lostT > 2) d.state = "wander"; }

    let tx, ty, sp;
    if (d.state === "chase"){ tx = p.x; ty = p.y; sp = DOG_SPEED_CHASE; }
    else {
      const w = d.path[d.wp]; tx = w[0]; ty = w[1]; sp = DOG_SPEED_WANDER;
      if (Math.hypot(tx - d.x, ty - d.y) < 12){ d.wp = (d.wp + 1) % d.path.length; continue; }
    }
    const vx = tx - d.x, vy = ty - d.y, L = Math.hypot(vx, vy) || 1;
    const sx = vx / L * sp * dt, sy = vy / L * sp * dt;
    // dogs hate the shade: never step into it
    const inShadeNext = level.shade.some(r => pointIn(d.x + sx, d.y + sy, r));
    if (!inShadeNext){
      const ox = d.x, oy = d.y;
      moveAxis(d, sx, 0, walls); moveAxis(d, 0, sy, walls);
      if (Math.hypot(d.x - ox, d.y - oy) < 0.2 && d.state === "wander") d.wp = (d.wp + 1) % d.path.length; // stuck: next waypoint
    }
    d.fx = vx / L; d.fy = vy / L;

    // lick!
    if (d.lickCd <= 0 && dist < p.half + d.half + 2){
      setSize(p, p.size - LICK_COST, walls);
      const kx = (p.x - d.x) / (dist || 1), ky = (p.y - d.y) / (dist || 1);
      p.kbx = kx * 260; p.kby = ky * 260;        // shove, decays in update()
      p.hurtT = 0.4; shakeT = 0.25; callout("LICKED!  \u2212" + LICK_COST, "#ff9a7a");
      d.lickCd = 1.2; d.state = "pause"; d.t = 1.4;
      for (let i = 0; i < 12; i++) spawnDrip(p.x, p.y, false);
    }
  }
}
function updateGull(dt){
  const g = gull, p = player;
  if (!g) return;
  g.t -= dt;
  if (g.phase === "circle"){
    g.ang += dt * 1.1;
    g.x = p.x + Math.cos(g.ang) * 150; g.y = p.y + Math.sin(g.ang) * 110; g.h = 1;
    if (g.t <= 0){ g.phase = "warn"; g.t = GULL_WARN; g.tx = p.x; g.ty = p.y; }
  } else if (g.phase === "warn"){
    g.ang += dt * 2.5;
    g.x = g.tx + Math.cos(g.ang) * 60; g.y = g.ty + Math.sin(g.ang) * 60;
    if (g.t <= 0){ g.phase = "dive"; g.t = GULL_DIVE; g.sx = g.x; g.sy = g.y; }
  } else if (g.phase === "dive"){
    const k = 1 - Math.max(0, g.t / GULL_DIVE);
    g.x = g.sx + (g.tx - g.sx) * k; g.y = g.sy + (g.ty - g.sy) * k; g.h = 1 - k;
    if (g.t <= 0){
      if (Math.hypot(p.x - g.tx, p.y - g.ty) < GULL_HIT_R + p.half * 0.5){
        setSize(p, p.size - GULL_COST, level.walls); p.hurtT = 0.4; shakeT = 0.3;
        callout("PECKED!  \u2212" + GULL_COST, "#ff9a7a");
        for (let i = 0; i < 12; i++) spawnDrip(p.x, p.y, false);
      }
      g.phase = "climb"; g.t = 1.2;
    }
  } else { // climb
    g.h = Math.min(1, g.h + dt / 1.2);
    if (g.t <= 0){ g.phase = "circle"; g.t = 5 + Math.random() * 3; }
  }
}

/* ------------------------------------------------- 6b. CALLOUTS (HUD) */
let calloutT = 0, lastZone = "open";
function callout(text, color){
  const el = document.getElementById("callout");
  el.textContent = text; el.style.color = color; el.style.opacity = 1; calloutT = 1.4;
}
function zoneCallouts(p, rate){
  const zone = p.inShade ? "shade" : rate >= DRAIN_HOT ? "hot" : rate >= DRAIN_SUN ? "sun" : "open";
  if (zone !== lastZone){
    if (zone === "sun")   callout("\u2600 SUN  \u2014  MELTING FAST!", "#ffd34d");
    if (zone === "hot")   callout("\u2668 HOT TILE  \u2014  GET OFF!", "#ff6a4a");
    if (zone === "shade") callout("\u263d SHADE  \u2014  safe, melting stopped", "#8fd0ff");
    lastZone = zone;
  }
}

/* ----------------------------------------------------------- 7. UPDATE */
function update(dt){
  worldTime += dt;
  if (state !== STATE.PLAY) return;
  beamT += dt; levelTime += dt; totalTime = bankedTime + levelTime;
  const p = player, walls = level.walls;

  const inp = axisInput();
  p.moving = inp.dx !== 0 || inp.dy !== 0;
  const sp = speedFor(p.size) * dt;
  if (inp.dx) moveAxis(p, inp.dx * sp, 0, walls);
  if (inp.dy) moveAxis(p, 0, inp.dy * sp, walls);
  if (p.kbx || p.kby){                                   // knockback from a lick
    moveAxis(p, p.kbx * dt, 0, walls); moveAxis(p, 0, p.kby * dt, walls);
    p.kbx *= Math.pow(0.001, dt); p.kby *= Math.pow(0.001, dt);
    if (Math.abs(p.kbx) + Math.abs(p.kby) < 4){ p.kbx = p.kby = 0; }
  }
  p.hurtT = Math.max(0, p.hurtT - dt);

  p.inShade = level.shade.some(r => pointIn(p.x, p.y, r));
  const rate = drainAt(level, p.x, p.y, beamT);
  p.inSun = !p.inShade && rate >= DRAIN_SUN;
  zoneCallouts(p, rate);
  if (rate) setSize(p, p.size - rate * DIFFS[settings.diff].mult * dt, walls);

  for (const f of flakes){
    if (f.taken) continue;
    if (Math.hypot(f.x - p.x, f.y - p.y) < p.half + 12 && setSize(p, p.size + FLAKE_GAIN, walls)){
      f.taken = true; callout("\u2744 +" + FLAKE_GAIN + " SIZE", "#ffffff");
      for (let i = 0; i < 10; i++) spawnDrip(f.x, f.y, true);
    }
  }

  updateDogs(dt);
  updateGull(dt);

  p.dripTimer -= dt;
  if (p.moving && p.dripTimer <= 0){ p.dripTimer = 0.07; spawnDrip(p.x + (Math.random()-0.5)*p.half, p.y + p.half*0.5, false); }
  if (p.inSun && Math.random() < dt * 14) spawnDrip(p.x, p.y, false);

  if (p.size <= 0){ state = STATE.DEAD; deaths++; return; }
  const f = level.freezer;
  if (aabb(p.x-p.half, p.y-p.half, p.half*2, p.half*2, f.x, f.y, f.w, f.h)){
    bankedTime += levelTime; totalTime = bankedTime;
    state = (levelIndex >= LEVELS.length - 1) ? STATE.WIN : STATE.LEVELEND;
  }
}
function handleScreenKeys(){
  if (restartPressed){
    restartPressed = false;
    if (state === STATE.PLAY || state === STATE.DEAD) loadLevel(levelIndex);
  }
  if (!confirmPressed) return;
  confirmPressed = false;
  if      (state === STATE.TITLE){ if (menuPage === "main") startGame(); else menu("back"); }
  else if (state === STATE.DEAD)     loadLevel(levelIndex);
  else if (state === STATE.LEVELEND) loadLevel(levelIndex + 1);
  else if (state === STATE.WIN)      startGame();
}

function box(w, h, d, color, opts){

function floorPatch(r, color, emissive, opacity){

function buildScene(){
  if (!hasThree) return;

  // floor

  levelGroup.add(floor);
  // faint grid so distance reads

    awning.position.set(X(r.x + r.w/2), 3.6, Z(r.y + r.h/2)); awning.castShadow = true; levelGroup.add(awning);
    for (const [cx, cz] of [[r.x, r.y],[r.x+r.w, r.y],[r.x, r.y+r.h],[r.x+r.w, r.y+r.h]]){
      const post = box(0.12, 3.6, 0.12, 0x2d4f8a); post.position.set(X(cx), 1.8, Z(cz)); levelGroup.add(post);
    }
  }
  for (const r of level.sun){
    levelGroup.add(floorPatch(r, 0xffd966, 0xffb830, 1));
    const col = box(r.w / U, 5, r.h / U, 0xffe27a, {transparent:true, opacity:0.10, emissive:0xffcc55, depthWrite:false});
    col.position.set(X(r.x + r.w/2), 2.5, Z(r.y + r.h/2)); levelGroup.add(col);
    const orb = makeSunOrb(); orb.position.set(X(r.x + r.w/2), 6.2, Z(r.y + r.h/2)); levelGroup.add(orb); sunOrbs.push(orb);
  }
  for (const r of level.hot){
    const m = floorPatch(r, 0xff4a3a, 0xff2200, 1); m.userData.hot = true; levelGroup.add(m);
  }
  for (const b of level.beams){
    const r = {x:b.x0, y:b.y, w:b.w, h:b.h};
    const g = new THREE.Group();
    g.add(floorPatch({x:-r.w/2*0, y:0, w:r.w, h:r.h}, 0xffd966, 0xffb830, 1));
    const col = box(r.w / U, 5, r.h / U, 0xffffff, {transparent:true, opacity:0.14, emissive:0xffdd77, depthWrite:false});
    col.position.y = 2.5; g.add(col);
    g.children[0].position.set(0, 0.03, 0);
    g.position.set(X(r.x + r.w/2), 0, Z(r.y + r.h/2));
    const orb = makeSunOrb(); orb.position.y = 6.2; g.add(orb); sunOrbs.push(orb);
    levelGroup.add(g); beamMeshes.push(g);
  }

  // walls
  for (const w of level.walls){
    const m = box(w.w / U, 2.2, w.h / U, 0x2b3550, {roughness:0.8});
    m.position.set(X(w.x + w.w/2), 1.1, Z(w.y + w.h/2)); m.castShadow = true; m.receiveShadow = true;
    levelGroup.add(m);
  }
  // slot markers: glowing frame on the floor of each gap
  for (const g of level.slots){
    const m = floorPatch({x:g.x - 8, y:g.y, w:g.w + 16, h:g.h}, 0x96ebff, 0x55ccff, 0.7);
    m.position.y = 0.04; levelGroup.add(m); slotMeshes.push(m);
  }

  // freezer
  const f = level.freezer;
  const fz = box(f.w / U, 3.8, f.h / U, 0xcfe9ff, {emissive:0x5fb8ff, emissiveIntensity:0.5, roughness:0.3});
  fz.position.set(X(f.x + f.w/2), 1.9, Z(f.y + f.h/2)); fz.castShadow = true; levelGroup.add(fz);
  const door = box(f.w / U * 0.8, 2.6, 0.08, 0x9fd0f5); door.position.set(X(f.x + f.w/2), 1.9, Z(f.y + f.h) + 0.05); levelGroup.add(door);
  const handle = box(0.12, 1.0, 0.12, 0x2d5a8a); handle.position.set(X(f.x + f.w) - 0.6, 1.9, Z(f.y + f.h) + 0.15); levelGroup.add(handle);
  const fl = new THREE.PointLight(0x7fdfff, 1.4, 14); fl.position.set(X(f.x + f.w/2), 4.5, Z(f.y + f.h/2)); levelGroup.add(fl);

  // snowflakes
  const flGeo = new THREE.OctahedronGeometry(0.45, 0);
  const flMat = new THREE.MeshStandardMaterial({color:0xffffff, emissive:0x9fe0ff, emissiveIntensity:0.8});
  for (const s of flakes){
    const m = new THREE.Mesh(flGeo, flMat); m.position.set(X(s.x), 0.9, Z(s.y)); m.castShadow = true;
    levelGroup.add(m); flakeMeshes.push(m);
  }

  // hazards
  for (const d of dogs){ const m = makeDogMesh(); levelGroup.add(m); dogMeshes.push(m); }
  if (gull){
    gullMesh = makeGullMesh(); levelGroup.add(gullMesh);
    gullShadow = new THREE.Mesh(new THREE.CircleGeometry(1, 32),
       new THREE.MeshBasicMaterial({color:0x000000, transparent:true, opacity:0.55}));
    gullShadow.rotation.x = -Math.PI / 2; gullShadow.position.y = 0.05; gullShadow.visible = false;

/* particles: a pool of little blue spheres */
const dripGeo = hasThree ? new THREE.SphereGeometry(0.09, 6, 6) : null;
const dripMatBlue = hasThree ? new THREE.MeshBasicMaterial({color:0x6eb9ff, transparent:true, opacity:0.85}) : null;
const dripMatWhite = hasThree ? new THREE.MeshBasicMaterial({color:0xe6f7ff, transparent:true, opacity:0.95}) : null;
function spawnDrip(px, py, sparkle){
  if (!hasThree) return;
  let d = dripPool.pop();
  if (!d){ d = {mesh:new THREE.Mesh(dripGeo, dripMatBlue)}; scene.add(d.mesh); }
  d.mesh.material = sparkle ? dripMatWhite : dripMatBlue;
  d.mesh.visible = true;
  d.mesh.position.set(X(px), sparkle ? 1.0 : 0.2 + Math.random() * 0.3, Z(py));
  d.vx = (Math.random() - 0.5) * 1.5; d.vz = (Math.random() - 0.5) * 1.5;
  d.vy = sparkle ? 2 + Math.random() * 2 : 0.3;
  d.life = d.max = sparkle ? 0.6 : 0.7;
  const s = sparkle ? 1.2 : 0.7 + Math.random() * 0.6; d.mesh.scale.setScalar(s); d.s0 = s;
  drips.push(d);
}
function updateDrips(dt){
  for (let i = drips.length - 1; i >= 0; i--){
    const d = drips[i]; d.life -= dt;
    d.mesh.position.x += d.vx * dt; d.mesh.position.z += d.vz * dt; d.mesh.position.y += d.vy * dt;
    d.vy -= 5 * dt;
    if (d.mesh.position.y < 0.05){ d.mesh.position.y = 0.05; d.vy = 0; d.vx *= 0.8; d.vz *= 0.8; }
    d.mesh.scale.setScalar(Math.max(0.01, d.s0 * d.life / d.max));
    if (d.life <= 0){ d.mesh.visible = false; drips.splice(i, 1); dripPool.push(d); }
  }
}

function render3D(dt){
  if (!hasThree) return;
  const p = player;
  // --- cube ---
  const s = pxFor(p.size) / U;
  const alive = p.size > 0;
  cubeMesh.visible = alive; puddle.visible = !alive;
  if (alive){
    cubeMesh.scale.setScalar(s);
    cubeMesh.position.set(X(p.x), s / 2 + 0.02, Z(p.y));
    const worried = p.size < 45;
    browL.visible = browR.visible = mouthMesh.visible = worried;
    const look = worried ? Math.sin(worldTime * 9) * 0.04 : 0;
    eyeL.position.x = -0.2 + look; eyeR.position.x = 0.2 + look;
    cubeMat.color.setHex(p.hurtT > 0 ? 0xff9a9a : 0xb6ecff);
    cubeMat.emissive.setHex(p.hurtT > 0 ? 0x661111 : 0x1e4a66);
    if (p.moving) cubeMesh.rotation.y += Math.sin(worldTime * 12) * 0.002; else cubeMesh.rotation.y *= 0.9;
    for (let i = 0; i < 3; i++){
      const sw = sweat[i]; sw.visible = p.inSun;
      const t = (worldTime * 2.2 + i * 0.4) % 1;
      sw.position.set((i - 1) * 0.42, 0.55 + t * 0.5, 0.3); sw.scale.setScalar(1 - t * 0.7);
    }
  } else {
    puddle.position.set(X(p.x), 0.03, Z(p.y));
  }
  // --- level bits ---
  for (let i = 0; i < flakeMeshes.length; i++){
    const m = flakeMeshes[i]; m.visible = !flakes[i].taken;
    m.rotation.y += dt * 2; m.position.y = 0.9 + Math.sin(worldTime * 3 + i) * 0.12;
  }
  const br = beamRectsAt(level, beamT);
  for (let i = 0; i < beamMeshes.length; i++) beamMeshes[i].position.x = X(br[i].x + br[i].w / 2);
  for (const o of sunOrbs){ o.rotation.z += dt * 0.8; o.quaternion.copy(camera.quaternion); o.userData.orb.scale.setScalar(1 + 0.08 * Math.sin(worldTime * 5)); }
  const pulse = 0.4 + 0.3 * Math.sin(worldTime * 4);
  for (const m of slotMeshes) m.material.opacity = pulse + 0.3;
  for (const c of levelGroup.children) if (c.userData.hot) c.material.emissiveIntensity = 0.7 + 0.4 * Math.sin(worldTime * 6);
  // --- dogs ---
  for (let i = 0; i < dogMeshes.length; i++){
    const d = dogs[i], m = dogMeshes[i];
    m.position.set(X(d.x), 0, Z(d.y));
    m.rotation.y = Math.atan2(-d.fy, d.fx);
    const run = d.state === "chase" ? 18 : 9;
    m.position.y = Math.abs(Math.sin(worldTime * run)) * 0.12;
    m.userData.tongue.scale.x = d.state === "chase" ? 1.8 + Math.sin(worldTime * 20) * 0.4 : 1;
  }
  // --- gull ---
  if (gull){
    const g = gull;
    gullMesh.position.set(X(g.x), 1.2 + g.h * 9, Z(g.y));
    const dir = g.phase === "dive" ? Math.atan2(-(g.ty - g.sy), g.tx - g.sx) : g.ang + Math.PI / 2;
    gullMesh.rotation.y = dir;
    gullMesh.rotation.z = g.phase === "dive" ? -0.9 : 0;
    const flap = Math.sin(worldTime * 10) * 0.5;
    gullMesh.userData.wings[0].rotation.x =  flap; gullMesh.userData.wings[1].rotation.x = -flap;
    gullShadow.visible = g.phase === "warn" || g.phase === "dive";
    if (gullShadow.visible){
      const k = g.phase === "warn" ? 1 - g.t / GULL_WARN : 1;
      gullShadow.position.set(X(g.tx), 0.05, Z(g.ty));
      gullShadow.scale.setScalar(0.3 + 1.5 * k);
      gullShadow.material.opacity = 0.35 + 0.4 * k;
    }
  }
  updateDrips(dt);

  // --- camera: angled overhead, follows the cube, little shake when hurt ---
  const tx = X(p.x), tz = Z(p.y);
  const want = settings.camFar ? new THREE.Vector3(tx, 26, tz + 18) : new THREE.Vector3(tx, 20, tz + 14);
  camera.position.lerp(want, 1 - Math.pow(0.001, dt));
  if (shakeT > 0 && !settings.shake) shakeT = 0;
  if (shakeT > 0){ shakeT -= dt; camera.position.x += (Math.random()-0.5) * 0.3; camera.position.z += (Math.random()-0.5) * 0.3; }
  camera.lookAt(tx, 0.5, tz);
  renderer.render(scene, camera);
}

const $ = id => document.getElementById(id);
function renderHUD(){

  $("fill").style.width = (frac * 100) + "%";

  $("tip").innerHTML = level ? level.tips.join("<br>") : "";
  $("hud").className = (player && player.size > 0 && state === STATE.PLAY && !player.inShade &&
                        drainAt(level, player.x, player.y, beamT) >= DRAIN_SUN) ? "melting" : "";
  if (calloutT > 0){ calloutT -= 1/60; if (calloutT <= 0) $("callout").style.opacity = 0; }
}
let lastScreen = null, menuPage = "main";
function menu(action){                         // called by the buttons (onclick) and by keys
  if (action === "play"){ menuPage = "main"; startGame(); }
  else if (action === "settings") menuPage = "settings";
  else if (action === "help") menuPage = "help";
  else if (action === "back") menuPage = "main";
  else if (action === "diff"){ settings.diff = (settings.diff + 1) % DIFFS.length; saveSettings(); }
  else if (action === "shake"){ settings.shake = !settings.shake; saveSettings(); }
  else if (action === "cam"){ settings.camFar = !settings.camFar; saveSettings(); }
  lastScreen = null;
}
window.menu = menu;
addEventListener("keydown", e => {
  if (state !== STATE.TITLE) return;
  if (e.code === "KeyS" && menuPage === "main") menu("settings");
  if (e.code === "KeyH" && menuPage === "main") menu("help");
  if (e.code === "Escape" || e.code === "Backspace") menu("back");
  if (menuPage === "settings"){
    if (e.code === "Digit1") menu("diff"); if (e.code === "Digit2") menu("shake"); if (e.code === "Digit3") menu("cam");
  }
});
function renderScreen(){
  const el = $("screen");
  const key = state + ":" + levelIndex + ":" + Math.floor(totalTime) + ":" + menuPage + ":" + JSON.stringify(settings);
  if (key === lastScreen) return; lastScreen = key;
  let html = "";
  if (!hasThree){
    html = '<div><h1 class="red">Could not load three.js</h1><p>This game loads one library from the internet.<br>Connect and reload the page.</p></div>';
  } else if (state === STATE.TITLE && menuPage === "main"){
    html = '<div><h1 class="title">ICE CUBE RUN</h1><p class="sub">You\'re melting. Get to the freezer.</p>' +
      '<div class="menu">' +
      '<button class="btn sel" onclick="menu(\'play\')">\u25b6 &nbsp;Play <span class="val">Enter</span></button>' +
      '<button class="btn" onclick="menu(\'help\')">? &nbsp;How to play <span class="val">H</span></button>' +
      '<button class="btn" onclick="menu(\'settings\')">\u2699 &nbsp;Settings <span class="val">S</span></button>' +
      '</div><p class="hint">WASD / Arrow keys move &nbsp;&middot;&nbsp; R restarts a level &nbsp;&middot;&nbsp; click or use the keys</p></div>';
  } else if (state === STATE.TITLE && menuPage === "settings"){
    html = '<div><h1>Settings</h1><div class="menu">' +
      '<button class="btn" onclick="menu(\'diff\')">1 &nbsp;Melt speed <span class="val">' + DIFFS[settings.diff].name + '</span></button>' +
      '<button class="btn" onclick="menu(\'shake\')">2 &nbsp;Screen shake <span class="val">' + (settings.shake ? "On" : "Off") + '</span></button>' +
      '<button class="btn" onclick="menu(\'cam\')">3 &nbsp;Camera <span class="val">' + (settings.camFar ? "Far" : "Close") + '</span></button>' +
      '<button class="btn" onclick="menu(\'back\')">\u2190 &nbsp;Back <span class="val">Esc</span></button>' +
      '</div><p class="hint">Chill = 30% slower melting. Spicy = 40% faster. Saved on this computer.</p></div>';
  } else if (state === STATE.TITLE && menuPage === "help"){
    html = '<div><h1>How to play</h1>' +
      '<p>Your <b>size is your health</b>. It shrinks every second. Hit 0 and you\'re a puddle.<br>' +
      'Smaller is faster, and some slots only fit a small cube - so sometimes you melt <i>on purpose</i>.</p>' +
      '<div class="legend">' +
      '<span class="sw" style="background:#ffd966"></span><span>\u2600 <b>Sun</b> - melts you fast (look for the sun orb)</span>' +
      '<span class="sw" style="background:#ff4a3a"></span><span>\u2668 <b>Hot tile</b> - melts you even faster</span>' +
      '<span class="sw" style="background:#0b1a38;border:1px solid #39507e"></span><span>\u263d <b>Shade</b> - melting stops. Dogs won\'t go in.</span>' +
      '<span class="sw" style="background:#fff"></span><span>\u2744 <b>Snowflake</b> - grow back +' + FLAKE_GAIN + '</span>' +
      '<span class="sw" style="background:#b8773a"></span><span><b>Dog</b> - licks you (\u2212' + LICK_COST + '). Small cubes outrun it.</span>' +
      '<span class="sw" style="background:#f4f6fa"></span><span><b>Seagull</b> - marks you with a shadow, then dives (\u2212' + GULL_COST + ')</span>' +
      '<span class="sw" style="background:#cfe9ff;box-shadow:0 0 8px #7fdfff"></span><span>\u2744 <b>Freezer</b> - the goal</span>' +
      '</div><div class="menu"><button class="btn" onclick="menu(\'back\')">\u2190 &nbsp;Back <span class="val">Esc / Enter</span></button></div></div>';
  } else if (state === STATE.DEAD){
    html = '<div><h1 class="red">You melted!</h1><p>Find shade, grab snowflakes, and keep moving.</p>' +
      '<p class="go">Press Enter or R to retry level ' + (levelIndex + 1) + '</p></div>';
  } else if (state === STATE.LEVELEND){
    html = '<div><h1>LEVEL ' + (levelIndex + 1) + ' COMPLETE</h1><p>Level time: ' + fmtTime(levelTime) +
      '</p><p>Total so far: ' + fmtTime(totalTime) + '</p><p class="go">Press Enter for level ' + (levelIndex + 2) + '</p></div>';
  } else if (state === STATE.WIN){
    html = '<div><h1>You made it! Stay frosty.</h1><p style="font-size:26px;color:#fff">Total time: ' + fmtTime(totalTime) +
      '</p><p>Melted ' + deaths + ' time' + (deaths === 1 ? '' : 's') + ' along the way.</p>' +
      '<p class="go">Press Enter to play again</p></div>';
  }
  el.innerHTML = html;
  el.style.display = html ? "flex" : "none";
}

/* ----------------------------------------------------------- 10. LOOP */
let last = performance.now();
function frame(now){
  let dt = (now - last) / 1000; last = now;
  if (dt > 0.05) dt = 0.05;
  handleScreenKeys();
  update(dt);
  render3D(dt);
  renderHUD();
  renderScreen();
  requestAnimationFrame(frame);
}
if (hasThree){ initThree(); loadLevel(0); state = STATE.TITLE; }
requestAnimationFrame(frame);
</script>
</body>
</html>
